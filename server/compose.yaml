# Coordinator machine:   docker compose up --build
#   (starts coordinator + master + one searcher)
#   Run several searchers on one machine:  docker compose up --build --scale worker=3
#
# Every other machine:    SERVER=http://<coordinator-ip>:5000 docker compose up --build --no-deps worker
#   (starts only searchers that connect to the coordinator over the LAN)
#
# The model is stubbed by default so the loop runs without Ollama. To go live:
#   MODEL_MODE=ollama OLLAMA_HOST=http://<ollama-host>:11434 docker compose up
#   (from inside a container, localhost is not the host; use the host's IP or
#   host.docker.internal)

services:
  coord:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["python", "coord.py"]
    ports:
      - "5000:5000"
    environment:
      # Defaults to the built-in synthetic demo target. For a real target,
      # mount a host dir as a volume and point these at the two version trees.
      TARGET: ${TARGET:-sample}
      VERSION_A_DIR: ${VERSION_A_DIR:-/app/fixtures/sample_vA}
      VERSION_B_DIR: ${VERSION_B_DIR:-/app/fixtures/sample_vB}
      VERSION_A: ${VERSION_A:-sample_vA}
      VERSION_B: ${VERSION_B:-sample_vB}
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["python", "worker.py"]
    environment:
      SERVER: ${SERVER:-http://coord:5000}
      MODEL_MODE: ${MODEL_MODE:-stub}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
      WORKER_MODEL: ${WORKER_MODEL:-qwen2.5:3b}
    depends_on:
      - coord
    restart: unless-stopped

  master:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["python", "master.py"]
    environment:
      SERVER: ${SERVER:-http://coord:5000}
      # Pulled from the host environment; never hardcode the key. Unset => stub.
      FISH_API_KEY: ${FISH_API_KEY:-}
      FISH_MODEL: ${FISH_MODEL:-s2.1-pro-free}
      FISH_VOICE: ${FISH_VOICE:-}   # optional voice reference_id
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
    volumes:
      - ../output:/app/output      # finished track lands in repo-root/output/
      - ../input:/app/input:ro     # teammate's instrumental.(wav|mp3) goes here
    depends_on:
      - coord
    restart: "no"
